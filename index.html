<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>넘버블럭스 노래 & 가사 모음 v2.0 | Numberblocks Songs & Lyrics</title>
  <style>
    :root {
      --bg-page: #f4f6fb;
      --bg-card: #ffffff;
      --bg-muted: #edf1f8;
      --bg-accent-soft: #eef5ff;
      --text-main: #1b2232;
      --text-sub: #566378;
      --text-pron: #5b3cc4;
      --border: #dce2ee;
      --primary: #e62429;
      --accent-blue: #1877f2;
      --accent-green: #18a94b;
      --accent-amber: #f59f00;
      --shadow-sm: 0 2px 8px rgba(20, 32, 60, 0.06);
      --shadow-md: 0 10px 28px rgba(20, 32, 60, 0.10);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --lyric-scale: 1;
      --font-sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Rainbow Block Bar */
    .rainbow-bar {
      height: 8px;
      background: linear-gradient(
        90deg,
        #e62429 0% 14.28%,
        #ff7b00 14.28% 28.56%,
        #ffd000 28.56% 42.84%,
        #2ec44d 42.84% 57.12%,
        #1890ff 57.12% 71.40%,
        #5b3cc4 71.40% 85.68%,
        #b538d5 85.68% 100%
      );
    }

    /* Header */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 1.5rem;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: inherit;
    }

    .brand-blocks {
      display: grid;
      grid-template-columns: repeat(3, 14px);
      gap: 3px;
    }

    .brand-blocks span {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      display: block;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.22);
    }

    .brand-title h1 {
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .version-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #e8f0fe;
      color: var(--accent-blue);
    }

    .brand-title p {
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg-muted);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .segmented button {
      border: none;
      background: transparent;
      padding: 0.4rem 0.78rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .segmented button:hover {
      color: var(--text-main);
    }

    .segmented button.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .toggle-pill-btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s;
    }

    .toggle-pill-btn.active {
      background: #f3e8ff;
      border-color: #c084fc;
      color: #5b21b6;
    }

    /* Search & Filter Toolbar */
    .toolbar-wrap {
      max-width: 1320px;
      width: 100%;
      margin: 1.15rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      position: relative;
      flex: 1 1 320px;
      max-width: 520px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 2.5rem;
      border: 2px solid var(--border);
      border-radius: 999px;
      font-size: 0.94rem;
      background: var(--bg-card);
      color: var(--text-main);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(24, 119, 242, 0.14);
    }

    .search-icon {
      position: absolute;
      left: 0.92rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: var(--bg-muted);
      color: var(--text-sub);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .clear-btn.visible {
      display: inline-flex;
    }

    .chip-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }

    .range-chip {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-sub);
      padding: 0.32rem 0.72rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .range-chip:hover {
      border-color: #b5c4de;
      color: var(--text-main);
    }

    .range-chip.active {
      background: var(--text-main);
      border-color: var(--text-main);
      color: #fff;
    }

    /* Main 2-Column Layout */
    main {
      max-width: 1320px;
      width: 100%;
      margin: 1rem auto 2.5rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 1.4rem;
      align-items: start;
      flex: 1;
    }

    /* Left Sidebar: Song List */
    .song-list-panel {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 175px);
      position: sticky;
      top: 86px;
    }

    .panel-header {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafbfe;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .song-list {
      overflow-y: auto;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.72rem 0.82rem;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
    }

    .song-item:hover {
      background: var(--bg-muted);
    }

    .song-item.active {
      background: var(--bg-accent-soft);
      border-color: #9ec5fe;
    }

    .number-badge {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      color: #fff;
      flex-shrink: 0;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
    }

    .song-meta {
      flex: 1;
      min-width: 0;
    }

    .song-title-en {
      font-size: 0.93rem;
      font-weight: 800;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-title-ko {
      font-size: 0.8rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .song-item-right {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .fav-star-ind {
      color: #f59f00;
      font-size: 0.9rem;
    }

    .lang-pill {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.18rem 0.48rem;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .lang-pill.bilingual {
      background: #e3fcef;
      color: #0b6e3f;
    }

    .lang-pill.en-only {
      background: #fff3cd;
      color: #8a5300;
    }

    /* Right Panel: Lyrics & Visualizer */
    .lyrics-panel {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 1.65rem 1.85rem;
      min-height: 560px;
    }

    .lyrics-hero {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
      justify-content: space-between;
      padding-bottom: 1.2rem;
      border-bottom: 2px dashed var(--border);
      margin-bottom: 1.25rem;
    }

    .lyrics-hero-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .hero-badge {
      width: 62px;
      height: 62px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.38rem;
      font-weight: 900;
      color: #fff;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.22);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .hero-titles h2 {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }

    .hero-titles .subtitle-ko {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-top: 0.2rem;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 0.2rem 0.62rem;
      border-radius: 999px;
      background: var(--bg-muted);
      color: var(--text-sub);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .action-btn {
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      padding: 0.48rem 0.85rem;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--bg-muted);
    }

    .action-btn.fav-active {
      background: #fff8db;
      border-color: #ffd43b;
      color: #b45309;
    }

    /* Interactive Block Visualizer Box (Upgrade 3) */
    .visualizer-box {
      background: #f8faff;
      border: 1px solid #dbe4f3;
      border-radius: var(--radius-md);
      padding: 1rem 1.2rem;
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }

    .visualizer-info {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .visualizer-title {
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .visualizer-sub {
      font-size: 0.78rem;
      color: var(--text-sub);
    }

    .array-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .array-btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-sub);
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.12s;
    }

    .array-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .block-grid-stage {
      display: inline-grid;
      gap: 4px;
      padding: 0.55rem;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }

    .nb-unit {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(0, 0, 0, 0.12);
      transition: transform 0.15s;
    }

    .nb-unit.mini {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.2);
    }

    .nb-unit:hover {
      transform: scale(1.12);
    }

    /* Notices & Meaning Box for EN-Only */
    .en-only-notice {
      background: #fff9db;
      border: 1px solid #ffe066;
      color: #7c4d00;
      padding: 0.9rem 1.15rem;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      margin-bottom: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .en-only-notice-title {
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .en-only-meaning {
      color: #5c3c00;
      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.65);
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border-left: 3px solid #f59f00;
    }

    /* Line-by-Line Sync View (Upgrade 1) */
    .line-sync-container {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .sync-stanza-card {
      background: #fafbfe;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .sync-stanza-label {
      font-size: 0.73rem;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4rem;
    }

    .sync-line-pair {
      padding-left: 0.75rem;
      border-left: 3px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }

    .sync-line-en {
      font-size: calc(1.04rem * var(--lyric-scale));
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.55;
    }

    .sync-line-pron {
      font-size: calc(0.88rem * var(--lyric-scale));
      font-weight: 600;
      color: var(--text-pron);
      line-height: 1.45;
    }

    .sync-line-ko {
      font-size: calc(0.97rem * var(--lyric-scale));
      font-weight: 500;
      color: var(--text-sub);
      line-height: 1.55;
    }

    /* Side-by-Side / Single Column Grid View */
    .lyrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.35rem;
    }

    .lyrics-grid.single-col {
      grid-template-columns: 1fr;
    }

    .lyrics-col {
      background: #fafbfe;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.3rem 1.45rem;
    }

    .lyrics-col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.7rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stanza-block {
      margin-bottom: 1.25rem;
    }

    .stanza-block:last-child {
      margin-bottom: 0;
    }

    .stanza-line {
      margin-bottom: 0.45rem;
    }

    .stanza-line-en {
      font-size: calc(1.02rem * var(--lyric-scale));
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.65;
    }

    .stanza-line-pron {
      font-size: calc(0.86rem * var(--lyric-scale));
      color: var(--text-pron);
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 0.25rem;
    }

    .stanza-line-ko {
      font-size: calc(1.02rem * var(--lyric-scale));
      color: var(--text-main);
      line-height: 1.72;
    }

    /* Search Highlight */
    mark.hl {
      background: #ffec99;
      color: #1b2232;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 800;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-sub);
    }

    .empty-state h3 {
      font-size: 1.08rem;
      margin-bottom: 0.4rem;
      color: var(--text-main);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1b2232;
      color: #fff;
      padding: 0.75rem 1.15rem;
      border-radius: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 1.2rem;
      font-size: 0.8rem;
      color: var(--text-sub);
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }

    @media (max-width: 960px) {
      main {
        grid-template-columns: 1fr;
      }
      .song-list-panel {
        position: static;
        max-height: 320px;
      }
      .lyrics-grid {
        grid-template-columns: 1fr;
      }
      .lyrics-panel {
        padding: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="rainbow-bar"></div>

  <header>
    <div class="header-inner">
      <a href="#theme-song" class="brand" id="brandHomeLink">
        <div class="brand-blocks" aria-hidden="true">
          <span style="background:#e62429"></span>
          <span style="background:#ff7b00"></span>
          <span style="background:#ffd000"></span>
          <span style="background:#2ec44d"></span>
          <span style="background:#1890ff"></span>
          <span style="background:#7b2cbf"></span>
        </div>
        <div class="brand-title">
          <h1>넘버블럭스 노래 &amp; 가사 모음 <span class="version-badge">v2.0</span></h1>
          <p>Numberblocks Songs &amp; Lyrics Explorer (EN/KO 대조 · 발음 가이드 · 블록 조립기)</p>
        </div>
      </a>

      <div class="header-controls">
        <!-- Language View Mode -->
        <div class="segmented" role="group" aria-label="가사 표시 모드 선택">
          <button type="button" class="lang-mode-btn active" data-mode="line">한줄 대조</button>
          <button type="button" class="lang-mode-btn" data-mode="both">좌우 비교</button>
          <button type="button" class="lang-mode-btn" data-mode="en">English Only</button>
          <button type="button" class="lang-mode-btn" data-mode="ko">한글 가사만</button>
        </div>

        <!-- Pronunciation Guide Toggle (Upgrade 2) -->
        <button type="button" id="pronToggleBtn" class="toggle-pill-btn active" aria-pressed="true">
          <span>&#127908;</span>
          <span id="pronToggleText">발음 가이드 ON</span>
        </button>

        <!-- Font Size Controller (Upgrade 1) -->
        <div class="segmented" role="group" aria-label="가사 글자 크기 조절">

      {

        ],
        pronunciationKo: [
          "나인 앤 원 — 텐 어게인!\n에잇 앤 투 — 텐 어게인!\n세븐 앤 쓰리, 식스 앤 포,\n파이브 앤 파이브 메이크 텐 원스 모어!",
          "애니 웨이 유 스플릿 미, 애니 웨이 위 플레이,\n프렌즈 오브 텐 컴 투게더 투 세이브 더 데이!"
        ],
        lyricsKo: null
      }
    ];

    const STORAGE_KEYS = {
      favorites: "nb_music_favorites_v2",
      fontScale: "nb_music_font_scale_v2",
      pron: "nb_music_pron_v2"
    };

    function loadFavorites() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.favorites);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (_) {
        return [];
      }
    }

    function saveFavorites(list) {
      try {
        localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify(list));
      } catch (_) {}
    }

    const state = {
      searchQuery: "",
      langMode: "line",       // 'line' | 'both' | 'en' | 'ko'
      catalogFilter: "all",   // 'all' | 'favorites' | 'bilingual' | 'en-only'
      rangeFilter: "all",     // 'all' | '1-5' | '6-10' | '11-20' | 'special'
      showPronunciation: true,
      fontScale: "1",
      favorites: loadFavorites(),
      selectedSongId: SONGS_DATA[0].id,
      selectedArrayCols: null // dynamic columns for block array visualizer
    };

    // Restore saved settings
    try {
      const savedScale = localStorage.getItem(STORAGE_KEYS.fontScale);
      if (savedScale && ["0.9", "1", "1.15", "1.3"].includes(savedScale)) {
        state.fontScale = savedScale;
        document.documentElement.style.setProperty("--lyric-scale", savedScale);
      }
      const savedPron = localStorage.getItem(STORAGE_KEYS.pron);
      if (savedPron !== null) {
        state.showPronunciation = savedPron === "true";
      }
    } catch (_) {}

    // Check URL hash for initial song deep-link
    if (window.location.hash) {
      const hashId = window.location.hash.slice(1);
      if (SONGS_DATA.some((s) => s.id === hashId)) {
        state.selectedSongId = hashId;
      }
    }

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const songListContainer = document.getElementById("songListContainer");
    const songCountBadge = document.getElementById("songCountBadge");
    const lyricsViewer = document.getElementById("lyricsViewer");
    const favFilterBtn = document.getElementById("favFilterBtn");
    const pronToggleBtn = document.getElementById("pronToggleBtn");
    const pronToggleText = document.getElementById("pronToggleText");
    const toastMsg = document.getElementById("toastMsg");

    let toastTimer = null;
    function showToast(message) {
      toastMsg.textContent = message;
      toastMsg.classList.add("show");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastMsg.classList.remove("show");
      }, 2200);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(str, query) {
      const safe = escapeHtml(str);
      const q = (query || "").trim();
      if (!q) return safe;
      const safeQuery = escapeHtml(q);
      const regex = new RegExp(`(${escapeRegExp(safeQuery)})`, "gi");
      return safe.replace(regex, '<mark class="hl">$1</mark>');
    }

    function getFactorPairs(n) {
      const pairs = [];
      for (let r = 1; r <= n; r++) {
        if (n % r === 0) {
          pairs.push({ rows: r, cols: n / r });
        }
      }
      return pairs;
    }

    function updateFavBadgeCount() {
      favFilterBtn.innerHTML = `&#9733; 즐겨찾기 (${state.favorites.length})`;
    }

    function syncHeaderButtons() {
      pronToggleBtn.classList.toggle("active", state.showPronunciation);
      pronToggleBtn.setAttribute("aria-pressed", String(state.showPronunciation));
      pronToggleText.textContent = state.showPronunciation ? "발음 가이드 ON" : "발음 가이드 OFF";

      document.querySelectorAll(".font-size-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.scale === state.fontScale);
      });
    }

    function getFilteredSongs() {
      const q = state.searchQuery.trim().toLowerCase();
      return SONGS_DATA.filter((song) => {
        if (state.catalogFilter === "favorites" && !state.favorites.includes(song.id)) return false;
        if (state.catalogFilter === "bilingual" && !song.hasKorean) return false;
        if (state.catalogFilter === "en-only" && song.hasKorean) return false;
        if (state.rangeFilter !== "all" && song.rangeGroup !== state.rangeFilter) return false;

        if (!q) return true;
        const haystack = [
          song.numberLabel,
          song.titleEn,
          song.titleKo,
          song.season,
          song.meaningKo,
          ...(song.lyricsEn || []),
          ...(song.pronunciationKo || []),
          ...(song.lyricsKo || [])
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return haystack.includes(q);
      });
    }

    function renderSongList() {
      updateFavBadgeCount();
      const filtered = getFilteredSongs();
      songCountBadge.textContent = `${filtered.length}곡`;

      if (filtered.length === 0) {
        songListContainer.innerHTML = `
          <div class="empty-state">
            <h3>조건에 맞는 노래가 없습니다</h3>
            <p>검색어나 필터(즐겨찾기/구간)를 변경해 보세요.</p>
          </div>
        `;
        lyricsViewer.innerHTML = `
          <div class="empty-state">
            <h3>선택된 노래가 없습니다</h3>
            <p>좌측 상단의 필터를 '전체 곡' 또는 '전체 구간'으로 전환해 주세요.</p>
          </div>
        `;
        return;
      }

      if (!filtered.some((s) => s.id === state.selectedSongId)) {
        state.selectedSongId = filtered[0].id;
        state.selectedArrayCols = null;
      }

      songListContainer.innerHTML = filtered
        .map((song) => {
          const isActive = song.id === state.selectedSongId;
          const isFav = state.favorites.includes(song.id);
          const badgeClass = song.hasKorean ? "bilingual" : "en-only";
          const badgeText = song.hasKorean ? "EN·한글" : "EN Only";
          return `
            <button
              type="button"
              class="song-item ${isActive ? "active" : ""}"
              data-song-id="${escapeHtml(song.id)}"
              role="option"
              aria-selected="${isActive}"
            >
              <div class="number-badge" style="background:${song.color}">
                ${escapeHtml(song.numberLabel)}
              </div>
              <div class="song-meta">
                <div class="song-title-en">${highlightText(song.titleEn, state.searchQuery)}</div>
                <div class="song-title-ko">${highlightText(song.titleKo, state.searchQuery)}</div>
              </div>
              <div class="song-item-right">
                ${isFav ? '<span class="fav-star-ind" title="즐겨찾기 등록됨">&#9733;</span>' : ""}
                <span class="lang-pill ${badgeClass}">${badgeText}</span>
              </div>
            </button>
          `;
        })
        .join("");

      renderLyricsViewer();
    }

    function buildVisualizerHtml(song) {
      const count = song.blockCount || 1;
      const isHundred = count === 100;
      const pairs = isHundred
        ? [
            { rows: 10, cols: 10 },
            { rows: 5, cols: 20 },
            { rows: 4, cols: 25 }
          ]
        : getFactorPairs(count);

      if (!state.selectedArrayCols || !pairs.some((p) => p.cols === state.selectedArrayCols)) {
        // Pick a balanced default rectangle
        const mid = pairs[Math.floor(pairs.length / 2)];
        state.selectedArrayCols = mid ? mid.cols : count;
      }

      const activeCols = state.selectedArrayCols;
      const activeRows = Math.round(count / activeCols);

      const unitsHtml = Array.from({ length: count })
        .map((_, idx) => {
          let bg = song.color.startsWith("linear-gradient") ? "#e62429" : song.color;
          if (Array.isArray(song.blockColors) && song.blockColors.length > 0) {
            bg = song.blockColors[idx % song.blockColors.length];
          } else if (count > 10 && count < 20) {
            // Ten block (white with red border feel) + Ones blocks
            bg = idx < 10 ? "#f43f5e" : song.color;
          }
          return `<span class="nb-unit ${isHundred ? "mini" : ""}" style="background:${bg}" title="Block ${idx + 1}"></span>`;
        })
        .join("");

      const arrayBtnsHtml = pairs
        .map((p) => {
          const isAct = p.cols === activeCols;
          return `<button type="button" class="array-btn ${isAct ? "active" : ""}" data-cols="${p.cols}">${p.rows} &times; ${p.cols}</button>`;
        })
        .join("");

      return `
        <div class="visualizer-box" aria-label="인터랙티브 넘버블럭 배열 비주얼라이저">
          <div class="visualizer-info">
            <div class="visualizer-title">
              <span>&#129513; 인터랙티브 블록 배열 조립기 (총 ${count}블록: ${activeRows}줄 &times; ${activeCols}칸)</span>
            </div>
            <div class="visualizer-sub">약수 버튼을 눌러 직사각형 배열(Array) 모양을 바꿔 보세요!</div>
            <div class="array-btns">${arrayBtnsHtml}</div>
          </div>
          <div class="block-grid-stage" style="grid-template-columns: repeat(${activeCols}, auto);">
            ${unitsHtml}
          </div>
        </div>
      `;
    }

    function renderLyricsViewer() {
      const song = SONGS_DATA.find((s) => s.id === state.selectedSongId);
      if (!song) return;

      const isFav = state.favorites.includes(song.id);
      const q = state.searchQuery;

      const enOnlyNoticeHtml = !song.hasKorean
        ? `<div class="en-only-notice">
             <div class="en-only-notice-title">
               <span>&#9432;</span>
               <span>이 곡은 <strong>영어 전용(English-Only)</strong> 수록곡입니다. 한글 더빙 가사 대신 원문 가사와 발음 가이드, 우리말 뜻 해설을 제공합니다.</span>
             </div>
             ${song.meaningKo ? `<div class="en-only-meaning"><strong>우리말 곡 해설:</strong> ${highlightText(song.meaningKo, q)}</div>` : ""}
           </div>`
        : "";

      let bodyContentHtml = "";

      if (state.langMode === "line") {
        // Upgrade 1: Line-by-Line Interleaved Sync View
        const stanzasHtml = song.lyricsEn
          .map((enStanza, sIdx) => {
            const enLines = enStanza.split("\n");
            const pronLines = (song.pronunciationKo && song.pronunciationKo[sIdx] ? song.pronunciationKo[sIdx] : "").split("\n");
            const koLines = (song.hasKorean && song.lyricsKo && song.lyricsKo[sIdx] ? song.lyricsKo[sIdx] : "").split("\n");

            const pairsHtml = enLines
              .map((enLine, lIdx) => {
                const pronLine = pronLines[lIdx] || "";
                const koLine = koLines[lIdx] || "";
                return `
                  <div class="sync-line-pair">
                    <div class="sync-line-en">${highlightText(enLine, q)}</div>
                    ${state.showPronunciation && pronLine ? `<div class="sync-line-pron">[발음] ${highlightText(pronLine, q)}</div>` : ""}
                    ${song.hasKorean && koLine ? `<div class="sync-line-ko">${highlightText(koLine, q)}</div>` : ""}
                  </div>
                `;
              })
              .join("");

            return `
              <div class="sync-stanza-card">
                <div class="sync-stanza-label">Verse ${sIdx + 1} &bull; 한줄 대조 싱크</div>
                ${pairsHtml}
              </div>
            `;
          })
          .join("");

        bodyContentHtml = `<div class="line-sync-container">${stanzasHtml}</div>`;
      } else {
        // Side-by-Side ('both') or Single language ('en' / 'ko')
        const showEn = state.langMode === "both" || state.langMode === "en" || (!song.hasKorean && state.langMode === "ko");
        const showKo = (state.langMode === "both" || state.langMode === "ko") && song.hasKorean;
        const isSingleCol = !(showEn && showKo);

        const enColHtml = showEn
          ? `<div class="lyrics-col">
               <div class="lyrics-col-header">
                 <span>English Lyrics ${state.showPronunciation ? "+ 한글 독음" : ""}</span>
                 <span>EN</span>
               </div>
               ${song.lyricsEn
                 .map((enStanza, sIdx) => {
                   const enLines = enStanza.split("\n");
                   const pronLines = (song.pronunciationKo && song.pronunciationKo[sIdx] ? song.pronunciationKo[sIdx] : "").split("\n");
                   return `
                     <div class="stanza-block">
                       ${enLines
                         .map(
                           (line, lIdx) => `
                             <div class="stanza-line">
                               <div class="stanza-line-en">${highlightText(line, q)}</div>
                               ${
                                 state.showPronunciation && pronLines[lIdx]
                                   ? `<div class="stanza-line-pron">[발음] ${highlightText(pronLines[lIdx], q)}</div>`
                                   : ""
                               }
                             </div>
                           `
                         )
                         .join("")}
                     </div>
                   `;
                 })
                 .join("")}
             </div>`
          : "";

        const koColHtml = showKo
          ? `<div class="lyrics-col">
               <div class="lyrics-col-header">
                 <span>한국어 가사</span>
                 <span>KO</span>
               </div>
               ${song.lyricsKo
                 .map(
                   (koStanza) => `
                     <div class="stanza-block">
                       ${koStanza
                         .split("\n")
                         .map((line) => `<div class="stanza-line-ko">${highlightText(line, q)}</div>`)
                         .join("")}
                     </div>
                   `
                 )
                 .join("")}
             </div>`
          : "";

        bodyContentHtml = `
          <div class="lyrics-grid ${isSingleCol ? "single-col" : ""}">
            ${enColHtml}
            ${koColHtml}
          </div>
        `;
      }

      lyricsViewer.innerHTML = `
        <div class="lyrics-hero">
          <div class="lyrics-hero-left">
            <div class="hero-badge" style="background:${song.color}">
              ${escapeHtml(song.numberLabel)}
            </div>
            <div class="hero-titles">
              <h2>${highlightText(song.titleEn, q)}</h2>
              <div class="subtitle-ko">${highlightText(song.titleKo, q)}</div>
              <div class="hero-tags">
                <span class="tag">${escapeHtml(song.season)}</span>
                <span class="tag">${song.hasKorean ? "영어 + 한국어 가사 완비" : "English Only (영어 전용 + 뜻 해설)"}</span>
              </div>
            </div>
          </div>

          <div class="hero-actions">
            <button
              type="button"
              id="toggleFavCurrentBtn"
              class="action-btn ${isFav ? "fav-active" : ""}"
              aria-pressed="${isFav}"
            >
              <span>${isFav ? "&#9733;" : "&#9734;"}</span>
              <span>${isFav ? "즐겨찾기 됨" : "즐겨찾기 추가"}</span>
            </button>
            <button type="button" id="copyLyricsBtn" class="action-btn">
              <span>&#128203;</span>
              <span>가사 복사</span>
            </button>
          </div>
        </div>

        ${buildVisualizerHtml(song)}
        ${enOnlyNoticeHtml}
        ${bodyContentHtml}
      `;
    }

    function copyCurrentSongLyrics() {
      const song = SONGS_DATA.find((s) => s.id === state.selectedSongId);
      if (!song) return;

      const lines = [`[${song.titleEn} / ${song.titleKo}]`];
      song.lyricsEn.forEach((stanza, sIdx) => {
        lines.push("");
        const enArr = stanza.split("\n");
        const pronArr = (song.pronunciationKo && song.pronunciationKo[sIdx] ? song.pronunciationKo[sIdx] : "").split("\n");
        const koArr = (song.hasKorean && song.lyricsKo && song.lyricsKo[sIdx] ? song.lyricsKo[sIdx] : "").split("\n");
        enArr.forEach((enLine, lIdx) => {
          lines.push(enLine);
          if (state.showPronunciation && pronArr[lIdx]) {
            lines.push(`[발음] ${pronArr[lIdx]}`);
          }
          if (song.hasKorean && koArr[lIdx]) {
            lines.push(koArr[lIdx]);
          }
        });
      });

      const textToCopy = lines.join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(
          () => showToast("가사가 클립보드에 복사되었습니다!"),
          () => showToast("복사를 완료했습니다.")
        );
      } else {
        showToast("가사가 준비되었습니다.");
      }
    }

    // Event Bindings
    searchInput.addEventListener("input", (e) => {
      state.searchQuery = e.target.value;
      clearSearchBtn.classList.toggle("visible", state.searchQuery.length > 0);
      renderSongList();
    });

    clearSearchBtn.addEventListener("click", () => {
      state.searchQuery = "";
      searchInput.value = "";
      clearSearchBtn.classList.remove("visible");
      searchInput.focus();
      renderSongList();
    });

    songListContainer.addEventListener("click", (e) => {
      const btn = e.target.closest(".song-item");
      if (!btn) return;
      state.selectedSongId = btn.dataset.songId;
      state.selectedArrayCols = null;
      history.replaceState(null, "", `#${state.selectedSongId}`);
      renderSongList();
    });

    lyricsViewer.addEventListener("click", (e) => {
      const arrayBtn = e.target.closest(".array-btn");
      if (arrayBtn) {
        state.selectedArrayCols = Number(arrayBtn.dataset.cols);
        renderLyricsViewer();
        return;
      }

      const favBtn = e.target.closest("#toggleFavCurrentBtn");
      if (favBtn) {
        const id = state.selectedSongId;
        if (state.favorites.includes(id)) {
          state.favorites = state.favorites.filter((item) => item !== id);
          showToast("즐겨찾기에서 해제되었습니다.");
        } else {
          state.favorites.push(id);
          showToast("즐겨찾기에 추가되었습니다!");
        }
        saveFavorites(state.favorites);
        renderSongList();
        return;
      }

      const copyBtn = e.target.closest("#copyLyricsBtn");
      if (copyBtn) {
        copyCurrentSongLyrics();
      }
    });

    document.querySelectorAll(".lang-mode-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-mode-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.langMode = btn.dataset.mode;
        renderLyricsViewer();
      });
    });

    pronToggleBtn.addEventListener("click", () => {
      state.showPronunciation = !state.showPronunciation;
      try {
        localStorage.setItem(STORAGE_KEYS.pron, String(state.showPronunciation));
      } catch (_) {}
      syncHeaderButtons();
      renderLyricsViewer();
    });

    document.querySelectorAll(".font-size-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.fontScale = btn.dataset.scale;
        document.documentElement.style.setProperty("--lyric-scale", state.fontScale);
        try {
          localStorage.setItem(STORAGE_KEYS.fontScale, state.fontScale);
        } catch (_) {}
        syncHeaderButtons();
      });
    });

    document.querySelectorAll(".catalog-filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".catalog-filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.catalogFilter = btn.dataset.filter;
        renderSongList();
      });
    });

    document.querySelectorAll(".range-chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".range-chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.rangeFilter = btn.dataset.range;
        renderSongList();
      });
    });

    // Initial render
    syncHeaderButtons();
    renderSongList();

    // Automated Browser QA Verification Hook (?qa=run)
    if (new URLSearchParams(window.location.search).get("qa") === "run") {
      const results = [];
      const assert = (name, cond, detail = "") => {
        results.push({ name, status: cond ? "PASS" : "FAIL", detail });
      };

      // 1. Zero-Dependency Check
      const extScripts = document.querySelectorAll('script[src], link[rel="stylesheet"][href^="http"]');
      assert("Zero-Dependency (외부 의존성 0건)", extScripts.length === 0, `external=${extScripts.length}`);

      // 2. Song Catalog & Line Alignment Integrity
      const totalSongs = SONGS_DATA.length;
      const enOnlySongs = SONGS_DATA.filter((s) => !s.hasKorean);
      const lineMismatch = SONGS_DATA.filter((s) => {
        const enCount = s.lyricsEn.join("\n").split("\n").length;
        const pronCount = (s.pronunciationKo || []).join("\n").split("\n").length;
        const koCount = s.hasKorean ? (s.lyricsKo || []).join("\n").split("\n").length : enCount;
        return enCount !== pronCount || enCount !== koCount;
      });
      assert("수록곡 카탈로그 및 한/영/발음 줄 수 1:1 매칭", totalSongs === 22 && enOnlySongs.length === 5 && lineMismatch.length === 0, `total=${totalSongs}, enOnly=${enOnlySongs.length}, mismatch=${lineMismatch.length}`);

      // 3. Upgrade 1: Line-by-Line Sync + Pronunciation + Font Scale
      assert("한줄 대조(Line Sync) 및 발음 가이드 렌더링", document.querySelectorAll(".sync-line-pair").length > 0 && document.querySelectorAll(".sync-line-pron").length > 0);
      document.querySelector('.font-size-btn[data-scale="1.3"]').click();
      assert("가사 글자 크기 컨트롤러 동작(--lyric-scale=1.3)", document.documentElement.style.getPropertyValue("--lyric-scale") === "1.3");
      document.querySelector('.font-size-btn[data-scale="1"]').click();

      // 4. Upgrade 2: EN-Only Edge Case in 'ko' Mode
      const blobBtn = document.querySelector('.song-item[data-song-id="numberblobs-song"]');
      if (blobBtn) blobBtn.click();
      document.querySelector('.lang-mode-btn[data-mode="ko"]').click();
      const noticeEl = document.querySelector(".en-only-notice");
      const meaningEl = document.querySelector(".en-only-meaning");
      const fallbackEnCol = document.querySelector(".stanza-line-en");
      assert("영어 전용 곡(EN-Only) 한글 모드 폴백 & 우리말 뜻 해설 표시", Boolean(noticeEl && meaningEl && fallbackEnCol));

      // 5. Upgrade 3: Interactive Block Visualizer & Favorites
      const twelveBtn = document.querySelector('.song-item[data-song-id="twelve-rectangle-rays"]');
      if (twelveBtn) twelveBtn.click();
      document.querySelector('.lang-mode-btn[data-mode="line"]').click();
      const arrayBtn2Cols = document.querySelector('.array-btn[data-cols="2"]');
      if (arrayBtn2Cols) arrayBtn2Cols.click();
      const gridStage = document.querySelector(".block-grid-stage");
      const units = document.querySelectorAll(".nb-unit");
      assert("인터랙티브 블록 배열 조립기(12블록 -> 6x2 배열 변환)", units.length === 12 && gridStage && gridStage.style.gridTemplateColumns.includes("repeat(2"));

      const favToggle = document.getElementById("toggleFavCurrentBtn");
      if (favToggle) favToggle.click();
      assert("즐겨찾기 추가 및 로컬 상태 반영", state.favorites.includes("twelve-rectangle-rays"));

      // 6. Search & Keyword Highlighting (<mark class="hl">)
      searchInput.value = "Octoblock";
      searchInput.dispatchEvent(new Event("input"));
      const hlMarks = document.querySelectorAll("mark.hl");
      assert("실시간 통합 검색 및 키워드 하이라이팅(<mark>)", document.querySelectorAll(".song-item").length >= 1 && hlMarks.length >= 1, `marks=${hlMarks.length}`);
      clearSearchBtn.click();

      const reportEl = document.createElement("pre");
      reportEl.id = "qaReport";
      reportEl.style.display = "none";
      reportEl.textContent = JSON.stringify({
        allPassed: results.every((r) => r.status === "PASS"),
        results
      });
      document.body.appendChild(reportEl);
    }
  </script>
</body>
</html>
